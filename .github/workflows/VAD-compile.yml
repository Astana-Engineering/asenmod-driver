name: Сборка драйвера
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        platform: [x64]
    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Настройка MSBuild
        uses: microsoft/setup-msbuild@v2

      # Visual Studio и рабочие нагрузки уже есть в образе, ставим только WDK.
      # Код 3010 означает "нужна перезагрузка" и ошибкой не является.
      - name: Установка WDK
        run: |
          choco install windowsdriverkit11 -y
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { exit $LASTEXITCODE }

      - name: Сборка драйвера
        run: |
          msbuild "VirtualAudioDriver.sln" /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}

      - name: Список собранных файлов
        if: always()
        run: Get-ChildItem -Recurse -Include *.sys,*.inf,*.cat -Path . | Select-Object FullName

      - name: Сохранение результата сборки
        uses: actions/upload-artifact@v4
        with:
          name: asenmod-driver-${{ matrix.platform }}-${{ matrix.configuration }}
          path: |
            **/*.sys
            **/*.inf
            **/*.cat
          if-no-files-found: warn
